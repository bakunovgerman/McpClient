version: '3.8'

services:
  weather-ai:
    build: .
    container_name: weather-ai-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-jdbc:h2:./data/weather_db;AUTO_SERVER=TRUE}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - weather-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # PostgreSQL (опционально, если хотите использовать вместо H2)
  postgres:
    image: postgres:15-alpine
    container_name: weather-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=weather_db
      - POSTGRES_USER=weatherapp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - weather-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherapp"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  weather-network:
    driver: bridge

volumes:
  postgres_data:
